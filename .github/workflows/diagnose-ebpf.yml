name: Diagnose eBPF dependencies

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cloud-diagnose-ebpf
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false

      - name: Merge eBPF branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ebpf-latest
          git merge --no-edit origin/ebpf-latest

      - name: Enable eBPF build tag
        run: |
          sed -i 's/"badlinkname", "tfogo_checklinkname0")/"badlinkname", "tfogo_checklinkname0", "with_ebpf")/' cmd/internal/build_libbox/main.go
          grep -n "with_ebpf" cmd/internal/build_libbox/main.go

      - name: Check Go module diff
        run: |
          go mod tidy -tags=with_ebpf -diff
          git diff -- go.mod go.sum

      - name: List eBPF package
        run: |
          go list -tags=with_ebpf ./protocol/ebpf
