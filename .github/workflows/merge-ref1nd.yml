name: Merge reF1nd features

on:
  push:
    branches: [ref1nd-features]
    paths: ['.github/workflows/merge-ref1nd.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-ref1nd
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream base (testing)
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "enfplove"
          git config user.email "enfplove@users.noreply.github.com"
          git config core.editor true
          git remote add ref1nd https://github.com/reF1nd/sing-box.git
          git fetch origin testing

      - name: Merge reF1nd-testing with upstream testing
        run: |
          exec > >(tee -a /tmp/merge.log) 2>&1
          git fetch ref1nd reF1nd-testing
          git checkout -B merge-work FETCH_HEAD
          MERGE_RC=0
          git merge origin/testing --no-edit --no-ff || MERGE_RC=$?
          echo "MERGE_RC=$MERGE_RC"
          echo "MERGE_RC=$MERGE_RC" >> "$GITHUB_ENV"
          if [ "$MERGE_RC" != "0" ]; then
            echo "=== CONFLICTED FILES ==="
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            echo "=== CONFLICT COUNT: $(wc -l < /tmp/conflicts.txt) ==="
            git add -A
            git commit -m "WIP: merge upstream testing into reF1nd-testing (conflict markers preserved)" --no-verify || true
          fi
          echo "=== RESULT LOG ==="
          git log --oneline -6

      - name: Record status and push WIP branch
        run: |
          exec > >(tee -a /tmp/merge.log) 2>&1
          mkdir -p .github
          if [ -f /tmp/conflicts.txt ]; then
            cp /tmp/conflicts.txt .github/MERGE_CONFLICTS.txt
          fi
          {
            echo "merge_rc=${MERGE_RC:-unknown}"
            if [ -f /tmp/conflicts.txt ]; then
              echo "conflicts=$(wc -l < /tmp/conflicts.txt)"
            else
              echo "conflicts=0"
            fi
          } > .github/MERGE_STATUS.txt
          cp /tmp/merge.log .github/MERGE_LOG.txt
          git add .github/MERGE_STATUS.txt .github/MERGE_LOG.txt .github/MERGE_CONFLICTS.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: record merge status" --no-verify
          git push origin merge-work:ref1nd-merge-wip --force
          echo "PUSHED_OK"
