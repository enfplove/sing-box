name: Merge reF1nd features

on:
  push:
    branches: [ref1nd-features]
    paths: ['.github/workflows/merge-ref1nd.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-ref1nd
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream base (testing)
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          set -x
          git config user.name "enfplove"
          git config user.email "enfplove@users.noreply.github.com"
          git remote add ref1nd https://github.com/reF1nd/sing-box.git

      - name: Merge upstream testing into reF1nd-testing
        id: domerge
        run: |
          set -x
          git fetch ref1nd reF1nd-testing
          git checkout -B merge-work FETCH_HEAD
          git log --oneline -3
          MERGE_RC=0
          git merge origin/testing --no-edit --no-ff || MERGE_RC=$?
          echo "merge_rc=$MERGE_RC" >> "$GITHUB_OUTPUT"
          echo "$MERGE_RC" > /tmp/merge_rc.txt
          if [ "$MERGE_RC" != "0" ]; then
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            echo "conflict_count=$(wc -l < /tmp/conflicts.txt)" >> "$GITHUB_OUTPUT"
            git add -A
            git commit -m "WIP merge upstream testing (markers preserved)" --no-verify || true
          fi
          git log --oneline -5

      - name: Push WIP result
        if: always()
        run: |
          set -x
          mkdir -p .github/merge-debug
          cp /tmp/merge_rc.txt .github/merge-debug/merge_rc.txt 2>/dev/null || echo unknown > .github/merge-debug/merge_rc.txt
          cp /tmp/conflicts.txt .github/merge-debug/MERGE_CONFLICTS.txt 2>/dev/null || echo "no conflicts" > .github/merge-debug/MERGE_CONFLICTS.txt
          git rev-parse origin/testing FETCH_HEAD > .github/merge-debug/shas.txt 2>/dev/null || true
          git add -A
          git commit -m "chore: merge debug info" --no-verify || true
          git push origin merge-work:ref1nd-merge-wip --force
          echo PUSH_DONE
