name: Repair and Strip eBPF

on:
  push:
    branches:
      - ref1nd-features
    paths:
      - '.github/workflows/repair-strip.yml'
  workflow_dispatch:

concurrency:
  group: repair-strip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-and-strip:
    name: Repair merge artifacts, then strip eBPF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ref1nd-features
          fetch-depth: 0

      - name: Configure git
        run: |-
          git config user.name "enfplove"
          git config user.email "white067@hotmail.com"

      - name: Restore files damaged by placeholder commit
        run: |-
          git checkout 3414d6276e1cc1144d001ee6a700c5ae0be3ec5a^ -- common/dialer/default.go protocol/group/selector.go protocol/group/urltest.go protocol/tun/inbound.go
          git status --porcelain

      - name: Apply repairs
        run: |-
          sed -i 's/\blistenConfig\b/listener/g' common/dialer/default.go
          sed -i '177,180d' protocol/group/selector.go
          sed -i '218,232d' protocol/group/urltest.go
          sed -i '113d' protocol/tun/inbound.go

      - name: Verify repairs
        run: |-
          FAIL=0
          if [ "$(grep -c 'func (s \*Selector) References' protocol/group/selector.go)" != "1" ]; then echo "::error::selector References count != 1"; FAIL=1; fi
          if [ "$(grep -c 'func (s \*URLTest) References' protocol/group/urltest.go)" != "1" ]; then echo "::error::urltest References count != 1"; FAIL=1; fi
          if grep -q 'usePlatformInterface :=' protocol/tun/inbound.go; then echo "::error::orphan var remains"; FAIL=1; fi
          if grep -q 'listenConfig' common/dialer/default.go; then echo "::error::listenConfig remains"; FAIL=1; fi
          if grep -q '__REPLACE__' common/dialer/default.go protocol/group/selector.go protocol/group/urltest.go protocol/tun/inbound.go; then echo "::error::placeholder remains"; FAIL=1; fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "Repairs verified."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false

      - name: Smoke build (with eBPF)
        run: |-
          go build ./...
          echo "Smoke build with eBPF OK."

      - name: Commit and push repair
        run: |-
          git add -A
          git commit -m "fix: repair merge artifacts blocking compilation"
          git push origin ref1nd-features

      - name: Tag snapshot ebpf-full
        run: |-
          git tag -fa ebpf-full -m "Snapshot of repaired mainline with full eBPF inbound (before strip)"
          git push -f origin refs/tags/ebpf-full

      - name: Revert eBPF commits
        run: |-
          git revert --no-commit 487fd79602accd4a099a15c8516a69147f127ce7 c6c3d866f57631968cef347e121d5dffac53b1f9

      - name: Keep workflows directory intact
        run: |-
          git checkout HEAD -- .github
          git status --porcelain | head -80

      - name: Verify strip
        run: |-
          FAIL=0
          if [ -d common/ebpf ]; then echo "::error::common/ebpf still exists"; FAIL=1; fi
          if [ -d protocol/ebpf ]; then echo "::error::protocol/ebpf still exists"; FAIL=1; fi
          if grep -rq "registerEBPFInbound" include/ 2>/dev/null; then echo "::error::include still references registerEBPFInbound"; FAIL=1; fi
          if grep -q "with_ebpf" cmd/internal/build_boxdd/main.go 2>/dev/null; then echo "::error::build_boxdd still enables with_ebpf"; FAIL=1; fi
          if grep -q "cilium/ebpf" go.mod 2>/dev/null; then echo "::error::go.mod still contains cilium/ebpf"; FAIL=1; fi
          for f in cmd/sing-box/cmd_tools_ebpf.go dns/transport/fakeip/store_ebpf.go option/ebpf.go include/ebpf.go include/ebpf_stub.go; do
            if [ -f "$f" ]; then echo "::error::$f still exists"; FAIL=1; fi
          done
          if ls common/dialer/ebpf_self_bypass_* >/dev/null 2>&1; then echo "::error::ebpf_self_bypass files remain"; FAIL=1; fi
          if ls experimental/clashapi/ebpf* >/dev/null 2>&1; then echo "::error::clashapi ebpf files remain"; FAIL=1; fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "Strip verification passed."

      - name: Smoke build (without eBPF)
        run: |-
          go build ./...
          echo "Smoke build without eBPF OK."

      - name: Commit and push strip
        run: |-
          git add -A
          git commit -m "chore(ebpf): strip eBPF inbound from mainline"
          git push origin ref1nd-features

      - name: Seed ebpf-latest branch
        run: |-
          if git ls-remote --exit-code --heads origin ebpf-latest >/dev/null 2>&1; then
            echo "ebpf-latest already exists. Skip seeding."
            exit 0
          fi
          git checkout -b ebpf-latest
          git remote add chizi https://github.com/CHIZI-0618/sing-box.git
          git fetch chizi ebpf-inbound
          git merge --no-commit chizi/ebpf-inbound
          git checkout ORIG_HEAD -- .github
          git add .github
          git commit --no-edit
          git push origin ebpf-latest
          echo "ebpf-latest seeded."